[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-from-scratch"
version = "0.1.0"
description = "A small DeepSeek-style Mixture-of-Experts transformer with a custom Triton grouped-GEMM kernel"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Tanish Vora", email = "tanishvora@berkeley.edu" }]
# On Linux, the torch wheel pulls in a matching triton. Triton only runs on NVIDIA GPUs
# (or in its CPU interpreter for tests); everything else works on any machine.
dependencies = ["torch>=2.4", "numpy"]

[project.optional-dependencies]
data = ["datasets", "tiktoken"]   # TinyStories download, GPT-2 tokenizer
plot = ["matplotlib"]
dev = ["pytest", "ruff"]
all = ["moe-from-scratch[data,plot,dev]"]

[tool.setuptools.packages.find]
include = ["moe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]   # small lambdas are used for kernel launch grids and benchmark closures
